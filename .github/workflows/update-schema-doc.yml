name: Update Schema Documentation

on:
  # Run on pushes to main branch
  push:
    branches: [main]
    paths:
      - 'scripts/export-schema.ts'
      - '**.sql'

  # Allow manual trigger
  workflow_dispatch:

  # Optional: Run on a schedule (nightly at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'

jobs:
  update-schema:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export schema from Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          echo "📊 Exporting database schema..."
          npx ts-node scripts/export-schema.ts

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet docs/SCHEMA.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No schema changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Schema changes detected"
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/SCHEMA.md
          git commit -m "docs: update database schema documentation [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ Schema documentation updated and committed"
          else
            echo "✅ Schema documentation is up to date"
          fi
